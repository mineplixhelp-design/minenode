<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mineplix Store - Lets For Survive</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-main: #0b0c10;
      --bg-container: #151821;
      --bg-card: #1f2330;
      --bg-hover: #2a2f40;
      --bg-active: #32384d;
      --text-main: #f0f2f5;
      --text-muted: #8c96a6;
      --line-color: #3a4154;
      --primary: #7c75ff;
      --primary-hover: #6a62ff;
      --primary-light: #222538;
      --sidebar-width: 260px;
      --transition-speed: 0.25s;
      --radius-sm: 8px;
      --radius-md: 12px;

      /* Nav Link Styling */
      --nav-bg: rgba(255, 255, 255, 0.05);
      --nav-hover-bg: rgba(255, 255, 255, 0.1);
      --nav-active-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease, border-color var(--transition-speed) ease;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
    }

    .mobile-menu-btn {
      background: transparent;
      border: none;
      outline: none;
      padding: 8px;
      color: var(--text-main);
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
    }

    .mobile-menu-btn i {
      color: var(--text-main);
    }

    .app-container {
      flex: 1;
      display: flex;
      height: 100%;
      height: 100dvh;
      background: var(--bg-container);
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background: var(--bg-card);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
      will-change: transform;
      transition: transform 0.25s ease, background-color var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 30px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 30px;
    }

    .sidebar-logo {
      width: 30px;
      height: 30px;
      object-fit: cover;
      border-radius: var(--radius-sm);
    }

    .sidebar-header h2 {
      font-size: 14px;
      font-weight: 700;
      line-height: 30px;
    }

    .close-sidebar-btn {
      display: none;
      background: transparent;
      border: none;
      outline: none;
      padding: 6px;
      color: var(--text-main);
      font-size: 18px;
      line-height: 1;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-title {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .nav-tree-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      outline: none;
      padding: 12px 16px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      background: var(--nav-bg);
      border-radius: var(--radius-sm);
      width: 100%;
      text-align: left;
      border: none;
    }

    .label {
      display: inline-block;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item:hover {
      background: var(--nav-hover-bg);
      color: var(--text-main);
    }

    .nav-item.active {
      background: var(--primary);
      color: var(--nav-active-text);
      font-weight: 700;
    }

    .store-card {
      margin-top: auto;
      background: var(--primary-light);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-radius: var(--radius-md);
    }

    .store-info-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .store-info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.12);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
    }

    .store-info-item strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .store-card-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .btn-store {
      background: var(--primary);
      color: #ffffff;
      border: none;
      outline: none;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      width: 100%;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: opacity 0.2s ease, background-color var(--transition-speed) ease;
    }

    .btn-store:hover {
      background: var(--primary-hover);
      opacity: 0.95;
    }

    .btn-store-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .btn-store-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .content-area {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .content-header {
      padding: 24px 32px 0 32px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .content-body {
      padding: 24px 32px 60px 32px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .grid-card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .grid-card-item {
      background: var(--bg-card);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: space-between;
      border-radius: var(--radius-md);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-title {
      font-size: 16px;
      font-weight: 700;
    }

    .item-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .item-features {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 12px;
    }

    .item-features li {
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-features li i {
      color: var(--primary);
      font-size: 11px;
    }

    .callout-box {
      padding: 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 12.5px;
      line-height: 1.5;
      background: var(--primary-light);
      color: var(--text-main);
      border-radius: var(--radius-md);
    }

    .callout-box i {
      font-size: 16px;
      margin-top: 2px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: #fff;
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 600;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 2000;
      border-radius: var(--radius-sm);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .mobile-header {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      padding: 0 16px;
      background: var(--bg-container);
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .mobile-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 30px;
    }

    .mobile-logo {
      width: 30px;
      height: 30px;
      object-fit: cover;
      border-radius: var(--radius-sm);
    }

    .mobile-brand span {
      font-weight: 700;
      font-size: 14px;
      line-height: 30px;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1001;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .sidebar-overlay.show {
      display: block;
      opacity: 1;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
        padding-top: 60px;
      }

      .mobile-header {
        display: flex;
      }

      .app-container {
        margin: 0;
        height: calc(100dvh - 60px);
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 85%;
        max-width: 300px;
        height: 100dvh;
        z-index: 1002;
        transform: translate3d(-100%, 0, 0);
        padding: 15px 20px 40px 20px;
      }

      .sidebar.show {
        transform: translate3d(0, 0, 0);
      }

      .close-sidebar-btn {
        display: inline-flex;
      }

      .content-header {
        padding: 16px 16px 0 16px;
      }

      .content-body {
        padding: 16px 16px 80px 16px;
      }
    }
  </style>
</head>
<body>

  <div class="mobile-header">
    <div class="mobile-brand">
      <img src="icon.png" alt="Mineplix" class="mobile-logo">
      <span>Mineplix Store</span>
    </div>
    <button id="sidebarToggle" class="mobile-menu-btn">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-container">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <img src="icon.png" alt="Mineplix" class="sidebar-logo">
          <h2>Mineplix Store</h2>
        </div>
        <button class="close-sidebar-btn" id="closeSidebarBtn">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="nav-group">
        <div class="nav-title">Kategori Produk</div>
        <div class="nav-tree-container">
          <a href="#ranks" class="nav-item" id="nav-ranks">
            <span class="label">VIP Ranks</span>
          </a>
          <a href="#keys" class="nav-item" id="nav-keys">
            <span class="label">Crate Keys</span>
          </a>
          <a href="#money" class="nav-item" id="nav-money">
            <span class="label">Server Money</span>
          </a>
        </div>
      </div>

      <div class="store-card">
        <div class="store-info-list">
          <div class="store-info-item">
            <span>Java IP:</span>
            <strong>play.mineplix.my.id</strong>
          </div>
          <div class="store-info-item">
            <span>Bedrock Port:</span>
            <strong>19132</strong>
          </div>
        </div>
        <div class="store-card-actions">
          <button class="btn-store" onclick="copyToClipboard('play.mineplix.my.id', 'IP Java berhasil disalin!')">
            <i class="fa-solid fa-copy"></i> Copy IP Java
          </button>
          <button class="btn-store btn-store-secondary" onclick="copyToClipboard('19132', 'Port Bedrock berhasil disalin!')">
            <i class="fa-solid fa-plug"></i> Copy Port Bedrock
          </button>
        </div>
      </div>
    </aside>

    <main class="content-area">
      <header class="content-header">
        <div class="breadcrumb">
          <span>Mineplix Store</span> <span>/</span> <span id="breadcrumbCurrent">VIP Ranks</span>
        </div>
        <h1 class="page-title" id="pageTitle">VIP Ranks</h1>
      </header>

      <div class="content-body" id="contentBody"></div>
    </main>

  </div>

  <div class="toast" id="toast">Berhasil disalin!</div>

  <script>
    let storeCategories = {};

    async function fetchProducts() {
      try {
        const response = await fetch('produk.json');
        if (!response.ok) throw new Error('Gagal memuat produk.json');
        storeCategories = await response.json();
        handleRoute();
      } catch (error) {
        console.error(error);
        document.getElementById('contentBody').innerHTML = '<p style="color: #ff5555;">Gagal memuat data produk. Pastikan produk.json berada di direktori yang sama.</p>';
      }
    }

    function handleRoute() {
      if (!Object.keys(storeCategories).length) return;

      let hash = window.location.hash.replace('#', '');
      if (!storeCategories[hash]) {
        hash = 'ranks';
      }

      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${hash}`);
      if (activeNav) activeNav.classList.add('active');

      renderCategory(hash);
      closeSidebarUI();
    }

    function renderCategory(categoryKey) {
      const data = storeCategories[categoryKey];
      if (!data) return;
      
      document.getElementById('breadcrumbCurrent').innerText = data.breadcrumb;
      document.getElementById('pageTitle').innerText = data.title;

      const contentBody = document.getElementById('contentBody');
      contentBody.innerHTML = '';

      if (data.notice) {
        const calloutDiv = document.createElement('div');
        calloutDiv.className = 'callout-box';
        calloutDiv.innerHTML = `
          <i class="fa-solid fa-circle-info"></i>
          <div>
            <strong style="display:block; margin-bottom:2px;">Informasi Pembelian</strong>
            <span>${data.notice}</span>
          </div>
        `;
        contentBody.appendChild(calloutDiv);
      }

      const gridWrap = document.createElement('div');
      gridWrap.className = 'grid-card-container';

      data.items.forEach(item => {
        const itemCard = document.createElement('div');
        itemCard.className = 'grid-card-item';
        itemCard.id = item.id;
        
        let featuresList = item.features.map(f => `<li><i class="fa-solid fa-check"></i> ${f}</li>`).join('');

        itemCard.innerHTML = `
          <div>
            <div class="item-header">
              <span class="item-title">${item.title}</span>
              <span class="item-price">${item.price}</span>
            </div>
            <ul class="item-features">
              ${featuresList}
            </ul>
          </div>
          <a href="purchase.html#${item.id}" class="btn-store" id="buy-${item.id}">Beli Sekarang</a>
        `;
        gridWrap.appendChild(itemCard);
      });

      contentBody.appendChild(gridWrap);
    }

    function copyToClipboard(text, msg) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(msg);
        });
      } else {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        showToast(msg);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    const sidebarToggle = document.getElementById('sidebarToggle');
    const closeSidebarBtn = document.getElementById('closeSidebarBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    function openSidebar() {
      if (!sidebar.classList.contains('show')) {
        sidebar.classList.add('show');
        sidebarOverlay.classList.add('show');
        document.body.style.overflow = 'hidden';
      }
    }

    function closeSidebarUI() {
      sidebar.classList.remove('show');
      sidebarOverlay.classList.remove('show');
      document.body.style.overflow = '';
    }

    if (sidebarToggle) sidebarToggle.addEventListener('click', openSidebar);
    if (closeSidebarBtn) closeSidebarBtn.addEventListener('click', closeSidebarUI);
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebarUI);

    window.addEventListener('hashchange', handleRoute);

    fetchProducts();
  </script>
</body>
</html>
